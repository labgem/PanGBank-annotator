name: fetch_pangbank_collection
description: Resolve a PanGBank collection release and collect pangenome family representative FASTA records.
keywords:
  - pangbank
  - pangenome
  - fasta
tools:
  - pangbank_api:
      description: PanGBank API metadata lookup for collection release and pangenome IDs.
input: []
output:
  - all_faa:
      type: file
      description: Concatenated pangenome family representative protein FASTA.
      pattern: all_protein_families.faa.gz
  - pangenome_families:
      type: file
      description: API-derived integer Pangenome_id to FASTA-derived Pangenome_family_id map.
      pattern: pangenome_families.tsv
  - pangenome_api_ids:
      type: file
      description: Local pangenome directory name to PanGBank integer pangenome ID map.
      pattern: pangenome_api_ids.tsv
authors:
  - yhoblos
